<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev.site</title>
<!-- Pico first, this site's few additions second, and the profile's own theme
     last. Last is necessary but not sufficient: Pico's palette sits on
     :root:not([data-theme=dark]), which is specificity (0,2,0), so the theme
     block matches it with :root[data-profile="…"] and wins on order. See
     applyTheme in app.js. -->
<link rel="stylesheet" href="/vendor/pico.min.css">
<link rel="stylesheet" href="/site.css">
<style id="profile-theme"></style>
</head>
<body>

<header class="container">
  <nav>
    <ul>
      <li><a href="/" class="contrast"><strong>dev.site</strong></a></li>
    </ul>
    <ul id="session"></ul>
  </nav>
</header>

<main class="container" id="main" aria-busy="true"></main>

<dialog id="viewer">
  <article>
    <header>
      <button aria-label="Close" rel="prev" id="viewer-close"></button>
      <strong id="viewer-title"></strong>
    </header>
    <ul class="hops" id="viewer-hops"></ul>
    <!-- The iframe is built in app.js, once per service, and removed on close. -->
    <div id="viewer-body"></div>
    <p id="viewer-status"></p>
  </article>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
