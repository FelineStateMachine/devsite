[workspace]
resolver = "2"
members = [
    "crates/devsite-proto",
    "crates/devsite-client",
    "crates/devsite-daemon",
    "crates/devsite-cli",
    "crates/devsite-server",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
devsite-proto = { path = "crates/devsite-proto" }
devsite-client = { path = "crates/devsite-client" }

anyhow = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
n0-future = "0.3"
data-encoding = "2"
